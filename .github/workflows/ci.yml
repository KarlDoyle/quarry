name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Sequential quality gates — cheapest, fastest signal first; each step only runs
# if the previous one passed. This is the same order the local pre-push hook
# runs, so "green here" means "green there".
#
# Quarry uses node:sqlite, so its `check`/`test` pnpm scripts carry
# `NODE_OPTIONS=--experimental-sqlite` internally — we invoke the named scripts
# here so that flag stays put.
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # No `version:` here on purpose — action-setup v6 hard-fails when it is set
      # alongside package.json's `packageManager` field, which is now the pin.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      # 1. Types — fastest failure.
      - name: Typecheck
        run: pnpm check

      # 2. Lint + format check (biome).
      - name: Lint
        run: pnpm lint

      # 3. Tests — unit + the secret-scan boundary test. Run with coverage so
      #    the ratchet in vitest.config.ts actually enforces (was previously
      #    `pnpm test`, which skips the --coverage flag and never triggers
      #    the thresholds — the ratchet was defined but not a real gate).
      - name: Test
        run: pnpm coverage

      # 4. Build last — the most expensive step.
      - name: Build
        run: pnpm build

      # Install the exact package tarball in an isolated consumer to catch
      # missing exports, build output, or runtime dependencies before release.
      - name: Verify packed package
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          tarball="$RUNNER_TEMP/mrkarldoyle-quarry-0.2.0.tgz"
          test -f "$tarball"
          mkdir -p "$RUNNER_TEMP/quarry-consumer"
          npm install --prefix "$RUNNER_TEMP/quarry-consumer" "$tarball"
          cd "$RUNNER_TEMP/quarry-consumer"
          NODE_OPTIONS=--experimental-sqlite node --input-type=module -e 'const q = await import("@mrkarldoyle/quarry"); if (!q.RepositoryIndexer || !q.VectorStore) process.exit(1);'
          ./node_modules/.bin/quarry --help
