name: seed-tier0-test
#
# Copy to .github/workflows/seed-tier0-test.yml in the target repo. The
# Tier-0 proof generator: on manual request, writes one timestamped line to
# reports/automerge-seed-test.md and opens a PR for it, authored by
# github-actions[bot], from a same-repo branch, touching only an
# allow-listed path. If your automerge-policy.yml's tier0.allow_paths
# includes "reports/**" (the shipped default), that PR is Tier-0 eligible by
# construction — this is the proof that automerge.yml really does merge
# something with zero human touch once its checks go green.
#
# EDIT-ME: the `gh workflow run ci.yml` line below names this repo's actual
# CI workflow FILE (not the `name:` field) by its filename in
# .github/workflows/. Only needed if your CI workflow doesn't already
# trigger on `push` to arbitrary branches — GITHUB_TOKEN-authored pushes and
# PR-creates don't trigger push/pull_request workflows (GitHub's own
# loop-prevention rule), so without this nudge the seed PR would sit with no
# checks and automerge.yml would never see it as green. If your CI workflow
# already triggers on push to any branch, delete this step.

on:
  workflow_dispatch:
    inputs:
      note:
        description: "Optional note to include in the seed line"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Configure git identity as github-actions[bot]
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create seed branch
        id: branch
        run: |
          BRANCH="automerge-seed/$(date -u +%Y%m%dT%H%M%SZ)"
          git checkout -b "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Write timestamped seed line
        run: |
          mkdir -p reports
          TS="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          NOTE="${{ github.event.inputs.note }}"
          if [ -n "$NOTE" ]; then
            echo "- ${TS} — seed-tier0-test run ${{ github.run_id }} — ${NOTE}" >> reports/automerge-seed-test.md
          else
            echo "- ${TS} — seed-tier0-test run ${{ github.run_id }}" >> reports/automerge-seed-test.md
          fi
          git add reports/automerge-seed-test.md

      - name: Commit
        run: git commit -m "seed - tier-0 automerge proof ($(date -u +%Y-%m-%dT%H:%M:%SZ))"

      - name: Push seed branch
        run: git push origin HEAD:"${{ steps.branch.outputs.branch }}"

      - name: Open PR as github-actions[bot]
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --title "seed: tier-0 automerge proof" \
            --body "Tier-0 proof PR, generated by seed-tier0-test.yml. Touches only reports/**, authored by github-actions[bot], same-repo branch. Should be auto-merged by automerge.yml with zero human touch once its check run goes green. See templates/merge-policy/PROOF-RUNBOOK.md." \
            --head "${{ steps.branch.outputs.branch }}" \
            --base "${{ github.event.repository.default_branch }}"

      - name: Kick CI on the seed branch (EDIT-ME — see header comment)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run ci.yml --ref "${{ steps.branch.outputs.branch }}"
